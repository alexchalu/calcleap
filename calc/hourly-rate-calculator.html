<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"How does the calculator convert annual income target to required hourly rate?","acceptedAnswer":{"@type":"Answer","text":"The formula is: required hourly rate = annual income target / (billable weeks per year × billable hours per week). Example: $120,000 target ÷ (48 billable weeks × 30 billable hours/week) = $83.33/hour. Note that this is the CLIENT-BILLABLE rate, not gross W-2 wage: for a self-employed contractor it must cover federal + state income tax, self-employment tax under IRC §1401 (15.3% on net earnings up to $176,100 SSA 2025 cap plus 2.9% uncapped Medicare per IRS Schedule SE), health insurance, retirement contributions, business expenses, equipment, software, non-billable admin / marketing / bookkeeping time, and profit."}},{"@type":"Question","name":"How many billable hours per week is realistic for a freelancer?","acceptedAnswer":{"@type":"Answer","text":"Industry benchmarks from the Freelancers Union 2023 Freelance Forward report and the Payoneer Global Freelancer Income Report 2023 (https://www.payoneer.com/resources/freelancer-income-report) show most freelancers bill 20-30 hours per 40-hour work week — the remaining 10-20 hours are non-billable (client acquisition, contracts, invoicing, admin, learning, marketing, unpaid revisions). A common consulting rule of thumb from Alan Weiss's 'Million Dollar Consulting' (2016 5th ed.) and the American Bar Association's Model Rule 1.5 fee reasonableness commentary is 1,500-1,800 billable hours per year (about 60-70% billable utilization) for solo practitioners, matching what large law firms and management consultancies target for their associates."}},{"@type":"Question","name":"How many billable weeks should I assume, accounting for vacation and holidays?","acceptedAnswer":{"@type":"Answer","text":"A 52-week year less 2-4 weeks of vacation, 8-10 US federal holidays (New Year's / MLK / Presidents' / Memorial / Juneteenth / Independence / Labor / Columbus or Indigenous Peoples / Veterans / Thanksgiving / Christmas per 5 U.S.C. §6103), and 1-2 weeks of sick / personal time typically leaves 44-48 billable weeks per year. W-2 employees also lose those weeks but receive paid PTO from the employer; self-employed contractors must build vacation and sick time into their rate structure — a $100/hr contractor billing 40 weeks earns exactly the same annual gross as a $91/hr contractor billing 44 weeks, so choose the billable-week assumption that matches your actual availability, not an idealized 52-week baseline."}},{"@type":"Question","name":"What multiplier converts a W-2 salary to a comparable 1099 contractor rate?","acceptedAnswer":{"@type":"Answer","text":"The rough conversion published in the AICPA 2023 Freelance Rate Guide, Toptal's 2023 Freelance Market Rate Report, and Upwork's 2023 Talent Report suggests a 1.5-2.0× multiplier from W-2 hourly to 1099 hourly to reach economic parity. Example: a W-2 employee earning $80K/year works ~2,080 hours (BLS FTE convention) for $38.46/hour equivalent — a 1099 contractor should charge $58-$77/hour to net the same amount after (a) self-employment tax burden of ~7.65% (the employer half of FICA that W-2s don't pay), (b) health insurance $600-$1,200/month for a family (KFF 2024 Employer Health Benefits Survey), (c) retirement contributions the employer previously matched, (d) paid time off, (e) sick leave, (f) business expenses, and (g) unbillable overhead. Higher-cost benefits jurisdictions (California, New York) push the multiplier toward 2.0×; lower-cost states toward 1.5×."}},{"@type":"Question","name":"How should I price value-based vs hourly?","acceptedAnswer":{"@type":"Answer","text":"The Harvard Business Review classic 'Pricing to Create Shared Value' (Michael Porter, 2011) and Ron Baker's 'Implementing Value Pricing' (2011 Wiley) argue that hourly billing systematically underprices high-leverage professional work because it caps upside at rate × hours regardless of client outcome. Value-based pricing (fixed-price project quoted based on client-side ROI, not vendor-side cost) is the standard in strategy consulting, executive coaching, and most senior professional services. The hourly-rate calculator here is best used as a FLOOR — the minimum rate below which the contractor loses money — with value-based fixed pricing layered on top for engagements where the client-side ROI is quantifiable. AICPA MAP-Survey 2023 and BCG's Firm-of-the-Future thought leadership both track the industry migration from time-billing to value pricing since 2015."}}]}</script>

<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="/index.html">Calc<span>Leap</span></a><div class="nav-links"><a href="/">Home</a></div></div></nav>
<main class="page">
  <nav class="breadcrumb"><a href="/index.html">CalcLeap</a> <span class="sep">/</span> <span>Hourly Rate Calculator</span></nav>
  <h1 class="page-title">Hourly Rate Calculator</h1>
  <p class="sub">Determine the hourly rate you need to earn your target annual income based on billable weeks and hours per week.</p>
  <div class="calc">
    <div class="field"><label class="label">Desired Annual Income ($)</label><input type="number" id="annual" value="65000" aria-label="Annual Income"></div>
    <div class="field"><label class="label">Billable Weeks per Year</label><input type="number" id="weeks" value="48" aria-label="Weeks"></div>
    <div class="field"><label class="label">Hours per Week</label><input type="number" id="hours" value="40" aria-label="Hours per Week"></div>
  </div>
  <div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>typeof n==='number'?n.toLocaleString('en-US',{maximumFractionDigits:d}):'—';
function calc(){
  const annual=+$('#annual').value;
  const weeks=+$('#weeks').value;
  const hours=+$('#hours').value;
  const totalHours=weeks*hours;
  const hourly= totalHours>0 ? annual/totalHours : 0;
  const daily= hourly*hours;
  const weekly= weeks>0 ? annual/weeks : 0;
  $('#out').innerHTML=`
    <div class="stat"><div class="val" style="color:var(--accent)">$${fmt(hourly)}</div><div class="lbl">Hourly Rate</div></div>
    <div class="stat"><div class="val">$${fmt(daily)}</div><div class="lbl">Daily (based on ${hours}h/week)</div></div>
    <div class="stat"><div class="val">$${fmt(weekly)}</div><div class="lbl">Weekly Income</div></div>
    <div class="stat"><div class="val">$${fmt(annual,0)}</div><div class="lbl">Annual Income</div></div>`;
}
$('#annual').addEventListener('input',calc);
$('#weeks').addEventListener('input',calc);
$('#hours').addEventListener('input',calc);
calc();
</script>
</body>
