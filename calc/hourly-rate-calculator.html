/* === CalcLeap Apple Design System === */
*{margin:0;padding:0;box-sizing:border-box}
:root{--white:#fff;--bg:#f5f5f7;--surface:#fff;--border:rgba(0,0,0,.08);--border-hover:rgba(0,0,0,.15);--text:#1d1d1f;--text-2:#424245;--text-3:#86868b;--accent:#0071e3;--accent-hover:#0077ED;--accent-bg:rgba(0,113,227,.06);--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 30px rgba(0,0,0,.08);--r:16px;--r-sm:12px;--r-xs:8px;--mw:980px;--font:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif;}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
.nav{position:sticky;top:0;z-index:100;background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:var(--mw);margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:48px}
.logo{font-size:1.1rem;font-weight:700;letter-spacing:-.02em}.logo span{color:var(--accent)}
.nav-links{display:flex;gap:.15rem}
.nav-links a{font-size:.8rem;color:var(--text-3);padding:.4rem .7rem;border-radius:6px;transition:all .15s}
.nav-links a:hover{color:var(--text);background:rgba(0,0,0,.04)}
.page{max-width:var(--mw);margin:0 auto;padding:0 2rem}
.breadcrumb{padding:1.25rem 0 .5rem;font-size:.8rem;color:var(--text-3)}
.breadcrumb a{color:var(--text-2)}.breadcrumb a:hover{color:var(--accent)}
.page-title{font-size:2.25rem;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-bottom:.5rem}
.calc{margin-top:1.5rem;display:grid;gap:1rem}
.field{display:flex;flex-direction:column}
.field label{margin-bottom:.25rem;font-weight:600}
.field input{padding:.5rem 0.75rem;border:1px solid var(--border);border-radius:var(--r-sm);font-size:1rem}
#out{margin-top:1.5rem;display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.stat{background:var(--surface);padding:1rem;border-radius:var(--r-sm);box-shadow:var(--shadow);text-align:center}
.stat .val{font-size:1.5rem;font-weight:700;color:var(--accent)}
.stat .lbl{font-size:.85rem;color:var(--text-2)}
</style>

<body>
<nav class="nav"><div class="nav-inner"><a class="logo" href="index.html">Calc<span>Leap</span></a><div class="nav-links"><a href="/">Home</a></div></div></nav>
<main class="page">
  <nav class="breadcrumb"><a href="index.html">CalcLeap</a> <span class="sep">/</span> <span>Hourly Rate Calculator</span></nav>
  <h1 class="page-title">Hourly Rate Calculator</h1>
  <p class="sub">Determine the hourly rate you need to earn your target annual income based on billable weeks and hours per week.</p>
  <div class="calc">
    <div class="field"><label class="label">Desired Annual Income ($)</label><input type="number" id="annual" value="65000" aria-label="Annual Income"></div>
    <div class="field"><label class="label">Billable Weeks per Year</label><input type="number" id="weeks" value="48" aria-label="Weeks"></div>
    <div class="field"><label class="label">Hours per Week</label><input type="number" id="hours" value="40" aria-label="Hours per Week"></div>
  </div>
  <div id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>typeof n==='number'?n.toLocaleString('en-US',{maximumFractionDigits:d}):'—';
function calc(){
  const annual=+$('#annual').value;
  const weeks=+$('#weeks').value;
  const hours=+$('#hours').value;
  const totalHours=weeks*hours;
  const hourly= totalHours>0 ? annual/totalHours : 0;
  const daily= hourly*hours;
  const weekly= weeks>0 ? annual/weeks : 0;
  $('#out').innerHTML=`
    <div class="stat"><div class="val" style="color:var(--accent)">$${fmt(hourly)}</div><div class="lbl">Hourly Rate</div></div>
    <div class="stat"><div class="val">$${fmt(daily)}</div><div class="lbl">Daily (based on ${hours}h/week)</div></div>
    <div class="stat"><div class="val">$${fmt(weekly)}</div><div class="lbl">Weekly Income</div></div>
    <div class="stat"><div class="val">$${fmt(annual,0)}</div><div class="lbl">Annual Income</div></div>`;
}
$('#annual').addEventListener('input',calc);
$('#weeks').addEventListener('input',calc);
$('#hours').addEventListener('input',calc);
calc();
</script>
</body>
